[package]
name = "ast-statefuzzer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hellpuffyt/AST-StateFuzzer"
description = "Structure-aware (AST-level) fuzzer with differential oracles, seeded reproducibility and grammar-aware test-case minimization"
keywords = ["fuzzing", "fuzzer", "ast", "minimization", "testing"]
categories = ["development-tools::testing", "command-line-utilities"]
readme = "README.md"
exclude = ["/fuzz", "/.github"]

[lib]
name = "astfuzz"
path = "src/lib.rs"

[[bin]]
name = "astfuzz"
path = "src/bin/astfuzz.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[profile.release]
# Crash detection relies on catching panics; `panic = "abort"` would turn every
# finding into a process abort. Do not change this.
panic = "unwind"
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
