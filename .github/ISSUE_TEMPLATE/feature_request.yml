name: Feature request
description: Suggest a new oracle, mutation operator, target language or reduction pass.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What class of bug can't be found or reduced today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would it work, and how would we test that it works (ideally a planted bug it should find)?
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
